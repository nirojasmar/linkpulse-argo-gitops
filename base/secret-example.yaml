# Example secret for linkpulse.
# In production, create this out-of-band with:
# kubectl create secret generic linkpulse-secrets -n linkpulse \
#   --from-literal=DATABASE_URL="postgresql+psycopg://postgres:postgres@postgres:5432/linkpulse" \
#   --from-literal=API_KEY="your-secure-api-key" \
#   --from-literal=POSTGRES_PASSWORD="postgres"
apiVersion: v1
kind: Secret
metadata:
  name: linkpulse-secrets
  labels:
    app.kubernetes.io/name: linkpulse-secrets
    app.kubernetes.io/part-of: linkpulse
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/linkpulse"
  API_KEY: "change-me-in-production"
  POSTGRES_PASSWORD: "postgres"
