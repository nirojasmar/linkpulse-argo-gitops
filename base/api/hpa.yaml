apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linkpulse-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: linkpulse-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: linkpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkpulse-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
